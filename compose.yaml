services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      CAD_AI_API_KEY: ${CAD_AI_API_KEY:-}
      CAD_AI_MODEL: ${CAD_AI_MODEL:-gpt-6}
    volumes:
      - cad-data:/data
    restart: unless-stopped
volumes:
  cad-data:
