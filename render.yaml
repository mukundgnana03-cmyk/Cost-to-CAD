# One application: browser UI + native CAD engine + Blender + persistent models.
services:
  - type: web
    name: form-cad
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    disk:
      name: cad-models
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8000"
